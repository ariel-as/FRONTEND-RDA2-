<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>Entradas y aforo | Administración Planeta Fitness</title>
<link rel="icon" href="../assets/img/logo/logo-planeta.png" type="image/png"><script src="../assets/js/tema.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><link rel="stylesheet" href="../assets/css/styles.css"></head>
<body class="bg-body-tertiary pf-admin" data-pagina="entradas-admin">
<a class="pf-saltar" href="#contenido">Ir al contenido principal</a>
<header class="bg-dark"><nav class="navbar navbar-expand-lg navbar-dark" aria-label="Navegación administrativa"><div class="container-fluid">
  <a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><picture><source type="image/webp" srcset="../assets/img/logo/logo-planeta-compact.webp"><img src="../assets/img/logo/logo-planeta.png" alt="Planeta Fitness" width="48" height="44" class="pf-admin-logo"></picture><span>Administrador</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-admin" aria-controls="menu-admin" aria-expanded="false" aria-label="Mostrar el menú de administración"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="menu-admin">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0" data-menu-admin><li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li></ul>
    <div class="d-flex align-items-center gap-2 ms-lg-2" data-cabecera-acciones>
      <div class="dropdown">
        <button type="button" class="pf-admin-usuario btn btn-outline-light btn-sm rounded-circle d-inline-flex align-items-center justify-content-center p-0" id="menu-usuario-admin" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Opciones de usuario">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0-2.2-2.7-4-6-4s-6 1.8-6 4v1h12v-1ZM3.1 12c.4-1.4 2.3-2.5 4.9-2.5s4.5 1.1 4.9 2.5H3.1Z"/></svg>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menu-usuario-admin">
          <li><p class="dropdown-header mb-0"><span data-admin-tipo class="fw-bold text-white">Administrador general</span></p></li>
          <li><a class="dropdown-item" href="../index.html">Ver sitio</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button type="button" class="dropdown-item" data-cerrar-sesion>Cerrar sesión</button></li>
        </ul>
      </div>
    </div>
  </div>
  <button type="button" class="btn btn-outline-light btn-sm pf-boton-tema ms-2" data-boton-tema aria-label="Cambiar el modo de color"><span aria-hidden="true" data-icono-tema>☾</span></button>
</div></nav></header>
<main id="contenido" class="container py-4">
  <h1 class="h3">Entradas y aforo</h1>
  <p class="text-body-secondary">Pantalla de recepción: escribe la cédula y pulsa Enter.</p>
  <p data-mensaje class="pf-mensaje" role="status" aria-live="polite" hidden></p>
  <section class="card shadow-sm mb-3" aria-labelledby="titulo-aforo"><div class="card-body">
    <h2 id="titulo-aforo" class="h5">Aforo actual</h2>
    <p class="display-6 fw-bold mb-2" data-aforo-texto aria-live="polite">Cargando…</p>
    <div class="progress pf-aforo-barra" role="progressbar" aria-labelledby="titulo-aforo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-aforo-barra><div class="progress-bar" style="width:0%"></div></div>
  </div></section>
  <section class="card shadow-sm mb-3" aria-labelledby="titulo-registro" data-permiso="entradas:gestionar"><div class="card-body">
    <h2 id="titulo-registro" class="h5">Registrar entrada</h2>
    <form id="form-cedula" class="d-flex flex-wrap gap-2 align-items-end" novalidate>
      <div><label class="form-label" for="cedula-entrada">Cédula del cliente</label><input class="form-control pf-entrada-cedula" id="cedula-entrada" name="cedula" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" data-mensaje-patron="La cédula tiene 10 dígitos." autocomplete="off" required></div>
      <button type="submit" class="btn btn-primary btn-lg">Consultar</button>
    </form>
    <p class="pf-dialogo-error mt-3" data-rechazo role="alert" hidden></p>
    <div class="mt-3" data-acceso aria-live="polite"></div>
  </div></section>
  <section class="card shadow-sm" id="pantalla-adentro" aria-labelledby="titulo-adentro" data-permiso="entradas:gestionar"><div class="card-body">
    <h2 id="titulo-adentro" class="h5">Personas adentro</h2>
    <div data-lista aria-busy="false"></div>
  </div></section>
</main>
<footer class="border-top py-4 mt-5"><p class="container text-center text-body-secondary mb-0">© <span data-anio>2026</span> Planeta Fitness</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module" src="../controllers/admin-entradas.controller.js"></script>
</body>
</html>
