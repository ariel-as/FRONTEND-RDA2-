name: VerificaciÃ³n y publicaciÃ³n

# El sitio se valida en cada cambio y solo se publica si todo pasa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Comprobaciones de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis de JavaScript
        run: |
          set -o pipefail
          archivos=$(find frontend pruebas -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          while IFS= read -r archivo; do
            node --check "$archivo"
          done <<< "$archivos"
          echo "Sintaxis correcta en $(printf '%s\n' "$archivos" | wc -l) archivos"

      - name: HTML, accesibilidad, rutas y arquitectura del frontend
        run: |
          codigo=0
          node pruebas/verificar-frontend.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo


  desplegar:
    name: Publicar en GitHub Pages
    needs: verificar
    # La publicaciÃ³n solo ocurre con un push a la rama principal, nunca desde una
    # pull request ni desde una ejecuciÃ³n manual incompleta.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      # Falla aquÃ­ si Pages no estÃ¡ habilitado en el repositorio, de modo que no
      # se publica nada sin la configuraciÃ³n correcta.
      - name: Verificar la configuraciÃ³n de Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp -r frontend/. _sitio/
          echo "Archivos preparados: $(find _sitio -type f | wc -l)"

      # Última revisión antes de publicar: comprueba sobre la copia final que no
      # hay rutas rotas ni destinos inseguros.
      - name: Validar el sitio preparado
        run: |
          codigo=0
          node pruebas/verificar-frontend.mjs _sitio > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
